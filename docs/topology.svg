<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <rect width="1000" height="520" fill="#ffffff"/>

  <!-- Networks -->
  <rect x="0" y="0" width="380" height="520" fill="#d6d3ea"/>
  <rect x="380" y="0" width="160" height="520" fill="#f9d5d5"/>
  <rect x="540" y="0" width="460" height="520" fill="#f9dcbf"/>
  <line x1="380" y1="0" x2="380" y2="520" stroke="#555" stroke-dasharray="6 4"/>
  <line x1="540" y1="0" x2="540" y2="520" stroke="#555" stroke-dasharray="6 4"/>

  <text x="10" y="26" font-size="18">172.20.21.0/24</text>
  <text x="290" y="26" font-size="16" font-weight="bold" fill="#33337a" text-anchor="end">home-lan</text>
  <text x="460" y="26" font-size="17" text-anchor="middle">192.168.1.0/24</text>
  <text x="460" y="46" font-size="16" font-weight="bold" text-anchor="middle">transit</text>
  <text x="550" y="26" font-size="18">172.20.22.0/24</text>
  <text x="990" y="26" font-size="16" font-weight="bold" fill="#8a4a10" text-anchor="end">office-lan</text>

  <!-- Container boxes -->
  <g fill="#f2f2f2" stroke="#444" stroke-dasharray="8 5" stroke-width="1.5">
    <rect x="12" y="60" width="150" height="420" fill="#f2f2f2" stroke="#444" stroke-dasharray="8 5" stroke-width="1.5"/>
    <rect x="190" y="60" width="180" height="420" fill="#f2f2f2" stroke="#444" stroke-dasharray="8 5" stroke-width="1.5"/>
    <rect x="550" y="60" width="180" height="420" fill="#f2f2f2" stroke="#444" stroke-dasharray="8 5" stroke-width="1.5"/>
    <rect x="760" y="60" width="228" height="420" fill="#f2f2f2" stroke="#444" stroke-dasharray="8 5" stroke-width="1.5"/>
  </g>
  <g font-size="20" text-anchor="middle">
    <text x="87" y="88">home-pc</text>
    <text x="280" y="88">home-gw</text>
    <text x="640" y="88">office-gw</text>
    <text x="874" y="88">office-pc</text>
  </g>

  <!-- Image badges -->
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">
    <rect x="32" y="440" width="110" height="26" rx="4" fill="#a80030"/><text x="87" y="458">Debian</text>
    <rect x="225" y="440" width="110" height="26" rx="4" fill="#e8812c"/><text x="280" y="458">VyOS</text>
    <rect x="585" y="440" width="110" height="26" rx="4" fill="#e8812c"/><text x="640" y="458">VyOS</text>
    <rect x="819" y="440" width="110" height="26" rx="4" fill="#a80030"/><text x="874" y="458">Debian</text>
  </g>

  <!-- WireGuard endpoints -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <rect x="300" y="104" width="62" height="44" rx="4" fill="#88171a"/>
    <text x="331" y="122" fill="#fff">WG</text><text x="331" y="140" fill="#fff" font-size="12">wg0</text>
    <text x="320" y="166" font-size="14" font-weight="normal">10.10.10.1</text>
    <rect x="890" y="104" width="62" height="44" rx="4" fill="#88171a"/>
    <text x="921" y="122" fill="#fff">WG</text><text x="921" y="140" fill="#fff" font-size="12">wg0</text>
    <text x="910" y="166" font-size="14" font-weight="normal">10.10.10.2</text>
  </g>

  <!-- Tunnel -->
  <rect x="250" y="178" width="730" height="40" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="262" y="204" font-size="15">home-gw 192.168.1.x:51820</text>
  <text x="635" y="204" font-size="14" text-anchor="middle" font-style="italic">WireGuard tunnel</text>
  <text x="970" y="204" font-size="15" text-anchor="end">office-pc 172.20.22.x</text>
  <text x="874" y="240" font-size="12" text-anchor="middle">source port: random (UDP)</text>

  <!-- Transit links -->
  <g stroke="#111" stroke-width="2.5">
    <line x1="370" y1="300" x2="550" y2="300" stroke="#111" stroke-width="2.5" fill="none"/>
    <line x1="460" y1="300" x2="460" y2="360" stroke="#111" stroke-width="2.5" fill="none"/>
  </g>
  <g fill="#111">
    <circle cx="370" cy="300" r="5"/><circle cx="550" cy="300" r="5"/><circle cx="460" cy="300" r="4"/>
  </g>
  <g font-size="15" text-anchor="end">
    <text x="362" y="292">eth0: 192.168.1.x</text>
    <text x="362" y="318" font-size="12">DHCP from Docker host</text>
  </g>
  <g font-size="15">
    <text x="558" y="292">eth0: 192.168.1.x</text>
    <text x="558" y="318" font-size="12">DHCP from Docker host</text>
  </g>

  <!-- Docker host / ISP -->
  <rect x="395" y="360" width="130" height="96" rx="6" fill="#fff" stroke="#1d63c6" stroke-width="2"/>
  <text x="460" y="381" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d63c6">Docker host</text>
  <text x="460" y="400" font-size="14" text-anchor="middle">192.168.1.254</text>
  <text x="460" y="417" font-size="11" text-anchor="middle">DHCP .100–.200</text>
  <text x="460" y="432" font-size="11" text-anchor="middle">NAT → Internet</text>
  <text x="460" y="447" font-size="11" text-anchor="middle">(NATed traffic only)</text>

  <!-- LAN links -->
  <g stroke="#111" stroke-width="2.5" fill="none">
    <line x1="162" y1="360" x2="190" y2="360" stroke="#111" stroke-width="2.5" fill="none"/>
    <polyline points="730,360 745,360 745,300 760,300" stroke="#111" stroke-width="2.5" fill="none"/>
  </g>
  <g fill="#111">
    <circle cx="162" cy="360" r="5"/><circle cx="190" cy="360" r="5"/>
    <circle cx="730" cy="360" r="5"/><circle cx="760" cy="300" r="5"/>
  </g>
  <g font-size="14">
    <text x="20" y="330">eth0: assigned</text>
    <text x="20" y="347">by your DHCP</text>
    <text x="20" y="364">(student config)</text>
    <text x="198" y="385" font-size="15">eth1: 172.20.21.254</text>
    <text x="198" y="402" font-size="12">(student config)</text>
    <text x="558" y="385" font-size="15">eth1: 172.20.22.254</text>
    <text x="558" y="402" font-size="12">(preconfigured)</text>
    <text x="768" y="292" font-size="15">eth0: 172.20.22.x</text>
    <text x="768" y="318" font-size="12">DHCP from office-gw</text>
    <text x="768" y="334" font-size="12">(.100–.200)</text>
  </g>

  <!-- NAT badges -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="570" y="410" width="140" height="22" rx="4" fill="#2b3a8c"/><text x="640" y="425" fill="#fff" font-size="11">SNAT masquerade</text>
    <rect x="225" y="410" width="110" height="22" rx="4" fill="none" stroke="#2b3a8c" stroke-dasharray="4 3"/><text x="280" y="425" fill="#2b3a8c">SNAT (todo)</text>
  </g>

  <rect x="200" y="490" width="600" height="26" fill="#ffffff" opacity="0.85"/>
  <text x="500" y="508" font-size="13" text-anchor="middle" fill="#333">All four are Docker containers · SSH on the PCs: ccna / ccna · VyOS: vyos / vyos</text>
</svg>
